name: ④ Release · Measure

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: "Label for this measurement (e.g. 1.3.0, main, branch name)"
        required: true
        default: main
        type: string
      source_ref:
        description: 'Tag/branch/SHA to measure (blank = version_label; main supported)'
        required: false
        default: ''
        type: string
      update_history:
        description: 'Open a metrics PR to update badge and size history?'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version_label:
        type: string
        required: true
      source_ref:
        type: string
        required: false
        default: ''
      update_history:
        type: boolean
        required: false
        default: true
    outputs:
      report_path:
        description: 'Markdown size report path (within the Measure runner)'
        value: ${{ jobs.measure.outputs.report_path }}

permissions:
  contents: read

jobs:
  measure:
    name: Measure source payload & report
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      report_path: ${{ steps.measure.outputs.report }}
    env:
      VERSION: ${{ inputs.version_label }}
      SOURCE_REF: ${{ inputs.source_ref }}
      OUTPUT: /tmp/ui-size-section.md
      JSON_OUTPUT: /tmp/ui-size-measurement.json

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve exact measurement ref
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_REF" ]]; then
            REF="$SOURCE_REF"
          else
            REF="$VERSION"
          fi
          if [[ "$REF" == "main" ]]; then
            git fetch origin main --no-tags
            SHA="$(git rev-parse origin/main)"
          elif git show-ref --verify --quiet "refs/tags/$REF"; then
            SHA="$(git rev-list -n 1 "refs/tags/$REF")"
          elif git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            SHA="$(git rev-parse "refs/remotes/origin/$REF")"
          elif [[ "$REF" =~ ^[0-9a-fA-F]{40}$ ]] && git cat-file -e "$REF^{commit}"; then
            SHA="$REF"
          else
            echo "::error::Cannot resolve source ref '$REF' to a Git tag/branch/commit."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Measuring '$VERSION' at commit $SHA (ref: $REF)"

      - name: Checkout exact measured commit
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test -f AmaniUI.podspec
          test -d Sources/AmaniUI

      - name: Measure source payload
        id: measure
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/amaniui-payload /tmp/amaniui-source-payload.zip
          mkdir -p /tmp/amaniui-payload/Sources
          cp AmaniUI.podspec /tmp/amaniui-payload/
          cp -a Sources/AmaniUI /tmp/amaniui-payload/Sources/
          (cd /tmp/amaniui-payload && zip -qr /tmp/amaniui-source-payload.zip .)
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('/tmp/amaniui-payload')
          z = pathlib.Path('/tmp/amaniui-source-payload.zip')
          zip_bytes = z.stat().st_size
          raw_bytes = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          human = lambda b: f'{b / 1048576:.2f} MB'
          version = os.environ['VERSION']
          measurement = {
              'version': version,
              'source_sha': os.environ['SOURCE_SHA'],
              'zip_bytes': zip_bytes,
              'raw_bytes': raw_bytes,
              'zip_human': human(zip_bytes),
              'raw_human': human(raw_bytes),
          }
          pathlib.Path(os.environ['OUTPUT']).write_text(
              '| Metric | Value |\n|---|---|\n'
              f'| Source payload (zip) | {human(zip_bytes)} |\n'
              f'| Source payload (uncompressed) | {human(raw_bytes)} |\n'
              f'| Source commit | `{measurement["source_sha"]}` |\n'
          )
          pathlib.Path(os.environ['JSON_OUTPUT']).write_text(json.dumps(measurement, indent=2) + '\n')
          PY
          echo "report=/tmp/ui-size-section.md" >> "$GITHUB_OUTPUT"
          {
            echo "## 📦 Source payload report — \`$VERSION\`"
            echo ""
            cat "$OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: ui-source-size-${{ github.run_id }}
          path: |
            /tmp/ui-size-section.md
            /tmp/ui-size-measurement.json

      - name: Checkout current main for documentation updates
        if: ${{ inputs.update_history == true }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git checkout -B main origin/main

      - name: Refresh badge and history from measured commit
        if: ${{ inputs.update_history == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/metrics
          python3 - <<'PY'
          import json, os, pathlib
          metrics = pathlib.Path('.github/metrics')
          data = json.loads(pathlib.Path(os.environ['JSON_OUTPUT']).read_text())
          version = data['version']
          size = data['zip_bytes']
          color = ('brightgreen' if size < 1_048_576 else
                   'blue' if size < 3_145_728 else
                   'orange' if size < 6_291_456 else 'red')
          badge = {'schemaVersion': 1, 'label': 'AmaniUI source',
                   'message': data['zip_human'], 'color': color}
          (metrics / 'amaniui-source-size.json').write_text(json.dumps(badge, indent=2) + '\n')
          latest = metrics / 'ui-size-latest.json'
          latest.write_text(json.dumps(data, indent=2) + '\n')
          history_path = metrics / 'ui-size-history.json'
          try:
              history = json.loads(history_path.read_text()) if history_path.exists() else []
          except (ValueError, TypeError) as exc:
              raise SystemExit(f'Invalid size history JSON: {exc}')
          if not isinstance(history, list):
              raise SystemExit('Expected size-history.json to contain an array')
          history = [x for x in history if isinstance(x, dict) and x.get('version') != version]
          history.insert(0, data)
          history_path.write_text(json.dumps(history, indent=2) + '\n')
          history_md = metrics / 'UI_SIZE_HISTORY.md'
          header = '# UI Size History\n\n'
          existing = history_md.read_text() if history_md.exists() else header
          body = existing[len(header):] if existing.startswith(header) else existing
          import re
          # Drop any previous version section so reruns do not duplicate it.
          pattern = re.compile(r'(?ms)^## 📦 Source payload size — `'+re.escape(version)+r'`\n.*?(?=^## 📦 Source payload size — `|\Z)')
          body = pattern.sub('', body).lstrip('\n')
          section = pathlib.Path(os.environ['OUTPUT']).read_text().strip()
          history_md.write_text(header + f'## 📦 Source payload size — `{version}`\n\n{section}\n\n' + body)
          PY

      - name: Open metrics PR
        if: ${{ inputs.update_history == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLUG="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          BRANCH="metrics/ui-size-${SLUG}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/metrics/
          if git diff --cached --quiet; then
            echo 'No metrics change to commit — skipping PR.'
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m "chore(metrics): record UI source size for ${VERSION}"
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          gh label create metrics --color C5DEF5 --description 'Auto-generated UI size metrics update' 2>/dev/null || true
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$PR_URL" ]]; then
            gh pr comment "$PR_URL" --body "Refreshed UI size metrics for \`${VERSION}\` (run \`${GITHUB_RUN_ID}\`)."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(metrics): UI size report for ${VERSION}" \
              --label metrics \
              --body "Measured AmaniUI source payload at \`${VERSION}\` using its exact Git ref. Updates source size badge and history. Merge to publish. Run: ${GITHUB_RUN_ID}."
          fi
