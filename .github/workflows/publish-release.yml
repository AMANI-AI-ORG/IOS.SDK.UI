name: ③ Release · Ship

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged release PR number to publish/retry (e.g. 42)'
        type: number
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: amaniui-publish
  cancel-in-progress: false

env:
  MOBILE_SDK_REPO: AMANI-AI-ORG/Mobile_SDK_Repo
  MOBILE_SDK_REPO_PATH: Mobile_SDK_Repo
  POD_NAME: AmaniUI
  PODSPEC_FILE: AmaniUI.podspec
  PODSPEC_SOURCE_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
  BUNDLE_GEMFILE: ${{ github.workspace }}/.github/Gemfile

jobs:
  publish:
    name: Create Tag, Update Specs Repo & Publish Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
      measure_size: ${{ steps.resolve.outputs.measure_size }}

    steps:
      - name: Resolve and validate merged release PR
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          MANUAL_PR: ${{ inputs.pr_number }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$RUN_REF" != 'refs/heads/main' ]]; then
            echo '::error::Manual publishing must be started from the main branch.'
            exit 1
          fi
          PR_NUMBER="$EVENT_PR"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then PR_NUMBER="$MANUAL_PR"; fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo '::error::A numeric PR number is required.'
            exit 1
          fi
          pr_json="$(mktemp)"
          trap 'rm -f "$pr_json"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$pr_json"
          if ! jq -e             --arg repo "$GITHUB_REPOSITORY"             '.merged == true and .base.ref == "main" and
             .head.repo.full_name == $repo and
             (.head.ref | startswith("release/")) and
             (.merge_commit_sha != null)' "$pr_json" >/dev/null; then
            echo '::error::PR must be merged into main, originate from this repository, and use a release/ branch.'
            exit 1
          fi
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            EVENT_MERGE_SHA='${{ github.event.pull_request.merge_commit_sha }}'
            API_MERGE_SHA="$(jq -r '.merge_commit_sha' "$pr_json")"
            if [[ "$EVENT_MERGE_SHA" != "$API_MERGE_SHA" ]]; then
              echo '::error::Merge SHA changed unexpectedly; refusing publish.'
              exit 1
            fi
          fi
          BRANCH="$(jq -r '.head.ref' "$pr_json")"
          MERGE_SHA="$(jq -r '.merge_commit_sha' "$pr_json")"
          MEASURE_SIZE="$(jq -r 'if any(.labels[]?; .name == "measure-size") then "true" else "false" end' "$pr_json")"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "measure_size=$MEASURE_SIZE" >> "$GITHUB_OUTPUT"
          echo "Validated merged PR #$PR_NUMBER on $MERGE_SHA"

      - name: Extract version from release branch
        id: version
        shell: bash
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          VERSION="${BRANCH#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9._-]*)?$ ]]; then
            echo "::error::Invalid release branch version: ${VERSION}"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"

      - name: Verify publishing credentials before mutations
        shell: bash
        env:
          SPECS_PAT: ${{ secrets.MOBILESDKREPO_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${SPECS_PAT}" ]]; then
            echo '::error::MOBILESDKREPO_PAT is missing. Check the production environment and Actions repository secrets.'
            exit 1
          fi
          echo "::add-mask::${SPECS_PAT}"

          echo 'Checking Mobile SDK repository API response...'
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${SPECS_PAT}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${MOBILE_SDK_REPO}")"
          echo "GitHub API HTTP status: ${http_status}"
          if [[ "$http_status" != '200' ]]; then
            error_message="$(jq -r '.message // "Unknown API error"' "$response_file" 2>/dev/null || echo 'Invalid GitHub API response')"
            echo "::error::Mobile SDK repository access failed: ${error_message}"
            exit 1
          fi
          jq -r '"Repository: \(.full_name // "unknown")", "Reported push permission: \(.permissions.push // "unknown")"' "$response_file"
          actual_repo="$(jq -r '.full_name // empty' "$response_file")"
          if [[ "$actual_repo" != "$MOBILE_SDK_REPO" ]]; then
            echo '::error::Unexpected repository response; ensure token can access the specs repository.'
            exit 1
          fi
          echo 'Source repository authentication check...'
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name'
          echo 'Credential preflight passed; write access will be tested by the actual pushes.'

      - name: Checkout source repo at merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout Mobile_SDK_Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MOBILE_SDK_REPO }}
          token: ${{ secrets.MOBILESDKREPO_PAT }}
          path: ${{ env.MOBILE_SDK_REPO_PATH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source and destination preconditions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          test -f "$PODSPEC_FILE" || { echo "::error::Missing ${PODSPEC_FILE}"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Source tag ${VERSION} already exists; check for a partial prior publish before retrying."
            exit 1
          fi
          git -C "$MOBILE_SDK_REPO_PATH" fetch origin
          SPEC_PATH="Specs/${POD_NAME}/${VERSION}/${POD_NAME}.podspec.json"
          if git -C "$MOBILE_SDK_REPO_PATH" cat-file -e "origin/HEAD:${SPEC_PATH}" 2>/dev/null || [[ -e "${MOBILE_SDK_REPO_PATH}/${SPEC_PATH}" ]]; then
            echo "::error::Spec already exists for ${VERSION}; do not overwrite a published version."
            exit 1
          fi
          echo "Preflight checks passed for ${VERSION}"

      - name: Set up Ruby with Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Show tool versions
        shell: bash
        run: |
          ruby -v
          bundle -v
          bundle exec pod --version

      - name: Find previous release tag
        id: prev_tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git fetch --tags
          PREV=$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | grep -v SNAPSHOT | grep -Fxv "$VERSION" | head -1 || true)
          if [[ -z "$PREV" ]]; then PREV=$(git rev-list --max-parents=0 HEAD | head -1); fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Detect pre-release version
        id: prerelease
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ "${VERSION,,}" =~ (snapshot|test|beta|alpha|rc|dev|canary|nightly|preview) ]]; then
            echo 'is_prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release podspec.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO_URL: ${{ env.PODSPEC_SOURCE_GIT_URL }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/specgen
          cp "$PODSPEC_FILE" ".tmp/specgen/${POD_NAME}.release.podspec"
          python3 - <<'PY'
          import os, pathlib, re, sys
          name=os.environ['POD_NAME']
          path=pathlib.Path(f'.tmp/specgen/{name}.release.podspec')
          content=path.read_text()
          version=os.environ['VERSION']
          url=os.environ['REPO_URL']
          content, vc=re.subn(r'(^\s*s\.version\s*=\s*)["\'][^"\']+["\']',lambda m:m.group(1)+f'"{version}"',content,count=1,flags=re.M)
          content, sc=re.subn(r'(^\s*s\.source\s*=\s*)\{[^\n]*\}',lambda m:m.group(1)+f'{{ :git => "{url}", :tag => "{version}" }}',content,count=1,flags=re.M)
          if vc!=1 or sc!=1: sys.exit('Could not update version/source in podspec')
          path.write_text(content)
          PY
          DEST="${MOBILE_SDK_REPO_PATH}/Specs/${POD_NAME}/${VERSION}"
          mkdir -p "$DEST"
          bundle exec pod ipc spec ".tmp/specgen/${POD_NAME}.release.podspec" > "${DEST}/${POD_NAME}.podspec.json"

      - name: Verify generated spec content
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO_URL: ${{ env.PODSPEC_SOURCE_GIT_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,sys
          v=os.environ['VERSION']; name=os.environ['POD_NAME']
          p=pathlib.Path(os.environ['MOBILE_SDK_REPO_PATH'])/'Specs'/name/v/(name+'.podspec.json')
          data=json.loads(p.read_text()); source=data.get('source',{})
          if data.get('version')!=v or source.get('git')!=os.environ['REPO_URL'] or source.get('tag')!=v:
              sys.exit('Generated spec version/source mismatch')
          print('Validated:',p)
          PY

      - name: Create and push source tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/${VERSION}"

      - name: Commit and push Mobile_SDK_Repo
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd "$MOBILE_SDK_REPO_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "Specs/${POD_NAME}/${VERSION}/${POD_NAME}.podspec.json"
          git diff --cached --quiet && { echo '::error::No spec change detected'; exit 1; }
          git commit -m "Release ${POD_NAME} ${VERSION}"
          git push origin HEAD

      - name: Process release notes from PR body
        id: notes
        shell: python3 {0}
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pr = os.environ['PR_NUMBER']
          response = subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True)
          raw = json.loads(response).get('body') or '' 
          match=re.search(r'###\s*Release\s*Notes\s*\n(.*)',raw,re.S|re.I)
          if match: raw=match.group(1).strip()
          labels=[(r'\bfix(?:es|ed)?\b','Fix'),(r'\bfeature\b','Feature'),(r'\bimprovement\b','Improvement'),(r'\bupdate[sd]?\b','Update'),(r'\bchange[sd]?\b','Change')]
          lines=[]
          for line in raw.splitlines():
              line=line.strip().lstrip('*-• ').strip()
              if not line: continue
              label=next((text for pat,text in labels if re.search(pat,line,re.I)),None)
              lines.append(f'* **{label}:** {line}' if label else f'* {line}')
          body='\n'.join(lines)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('body<<__DELIMITER__\n'+body+'\n__DELIMITER__\n')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: |
            ## What's Changed?

            ${{ steps.notes.outputs.body }}

            ---

            **Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ steps.version.outputs.value }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.prerelease.outputs.is_prerelease != 'true' }}
          token: ${{ github.token }}

      - name: Delete release branch
        shell: bash
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          git push origin --delete "$BRANCH" || true

  measure:
    name: Measure & record source payload size
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.is_prerelease != 'true' &&
      needs.publish.outputs.measure_size == 'true' &&
      github.event_name == 'pull_request' 
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-measure.yml
    with:
      version_label: ${{ needs.publish.outputs.version }}
      update_history: true
    secrets: inherit
